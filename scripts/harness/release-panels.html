<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>harness · o release veste os painéis do workspace</title>
<link rel="stylesheet" href="/global.css" />
<link rel="stylesheet" href="/workspacePanels.css" />
<style>
  /* o global.css é de APP (html/body sem scroll); o harness é página e rola */
  html, body { height: auto !important; min-height: 100%; overflow: auto !important; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--mono); }
  .h-page { display: grid; gap: 22px; padding: 18px 22px 30px; }
  .h-label { font: 11px var(--mono); color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
  .h-label b { color: var(--ink); }
  /* cada palco é uma caixa de altura fixa; no app quem dita é a janela */
  .h-board { height: 420px; display: flex; flex-direction: column; }
  .h-board > .board-main { flex: 1; min-height: 0; }
  .h-thread { padding: 14px 18px; font: 12.5px/1.55 var(--mono); color: var(--ink-2); }
  .h-thread b { color: var(--ink); font-weight: 600; }
  /* o CSS da cabeça, das janelas e do trilho é o REAL (global.css +
     workspacePanels.css): o harness só monta os componentes com dados fixos. */
</style>
</head>
<body>
<div id="root"></div>
<!-- scripts/harness-serve.mjs empacota scripts/harness/release-panels.tsx na hora -->
<script src="/release-panels.js"></script>
</body>
</html>
