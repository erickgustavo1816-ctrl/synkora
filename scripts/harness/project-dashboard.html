<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>harness · painel do projeto</title>
<link rel="stylesheet" href="/global.css" />
<link rel="stylesheet" href="/project-dashboard.css" />
<style>
  /* o global.css é de APP (html/body sem scroll); o harness é página e rola */
  html, body { height: auto !important; min-height: 100%; overflow: auto !important; }
  body { margin: 0; background: #e2dbc9; color: var(--ink); font-family: var(--mono); }
  .h-page { display: grid; gap: 12px; padding: 18px 22px 40px; justify-items: start; }
  .h-bar { display: flex; align-items: center; gap: 8px; }
  .h-bar button { font: 11.5px var(--mono); padding: 4px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--card); cursor: pointer; }
  .h-bar button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .h-label { margin: 10px 0 0; font: 11px var(--mono); color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
  .h-label b { color: var(--ink); }
  /* a folha é o `.board-content` do Board: papel, container `boardcontent` */
  .h-sheet { min-height: 520px; background: var(--paper); border: 1px solid var(--line-strong); border-radius: 12px; overflow: hidden; display: flex; }
  .h-sheet > .board-content { flex: 1; }
</style>
</head>
<body>
<div id="root"></div>
<!-- scripts/harness-serve.mjs empacota scripts/harness/project-dashboard.tsx na hora -->
<script src="/project-dashboard.js"></script>
</body>
</html>
