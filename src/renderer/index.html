<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Synkora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- img-src PRECISA de data:: a foto de projeto é uma data URL no
         projects.json — sem a diretiva, img-src herda default-src 'self' e
         toda foto quebra (bug real: o dataURL era PNG válido; o CSP recusava).
         blob: é somente para frames efêmeros e revogáveis do observador P28. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
